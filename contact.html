<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - SGI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50">
<nav class="bg-green-800 text-white p-4 flex justify-between">
  <h1 class="font-bold">SGI - Contact</h1>
  <a href="index.html" class="bg-white text-green-800 px-3 py-1 rounded">Home</a>
</nav>

<div class="p-10 grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
  <div class="bg-white p-6 shadow rounded">
    <h2 class="font-bold text-xl">Contact Us</h2>
    <p class="mt-3">📍 Rongai, Nakuru, Kenya</p>
    <p>📧 info@sustainableglobalimpact.org</p>
    <p>📞 +254 7XX XXX XXX</p>
    
    <h3 class="mt-6 font-bold">Follow Us</h3>
    <div class="flex gap-4 text-2xl mt-3 text-green-700">
      <a href="https://facebook.com/yourpage" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://linkedin.com/company/yourpage" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="https://x.com/yourpage" target="_blank"><i class="fab fa-x-twitter"></i></a>
      <a href="https://tiktok.com/@yourpage" target="_blank"><i class="fab fa-tiktok"></i></a>
    </div>
    <p class="text-xs text-gray-500 mt-2">Replace links above with real SGI pages</p>
  </div>

  <div class="bg-white p-6 shadow rounded">
    <h2 class="font-bold">Send Message</h2>
    <input placeholder="Your Name" class="w-full border p-2 rounded mt-3">
    <input placeholder="Your Email" class="w-full border p-2 rounded mt-3">
    <textarea placeholder="Message" class="w-full border p-2 rounded mt-3 h-24"></textarea>
    <button class="w-full bg-green-700 text-white p-2 rounded mt-3">Send</button>
  </div>
</div>
</body>
</html>
